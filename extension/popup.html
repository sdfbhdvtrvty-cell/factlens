<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>FactLens</h1>
    <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
  </header>

  <section class="status">
    <div class="light" id="light">
      <i data-c="red"></i><i data-c="amber"></i><i data-c="green"></i>
    </div>
    <div>
      <div id="statusTitle" class="title">Idle</div>
      <div id="statusSub" class="sub"></div>
    </div>
  </section>

  <div class="actions">
    <button id="scan">Scan this page now</button>
    <button id="retryBtn" class="secondary" style="display:none">Retry backend</button>
    <label class="row"><input type="checkbox" id="autoScan"> Scan text automatically as I scroll</label>
  </div>
  <div id="coverage" class="sub" style="display:none"></div>

  <div id="list" class="list"></div>

  <details>
    <summary>Settings</summary>
    <label>Text highlight threshold: <b id="confVal"></b>
      <input type="range" id="minConfidence" min="0.4" max="0.95" step="0.05">
    </label>
    <label>Min words per element: <b id="elVal"></b>
      <input type="range" id="minElWords" min="5" max="40" step="1">
    </label>
    <label>Min words per sentence: <b id="sentVal"></b>
      <input type="range" id="minSentWords" min="3" max="20" step="1">
    </label>
    <label>Max sentences per element: <input type="number" id="maxSentPerEl" min="1" max="10" step="1">
    </label>
    <label><input type="checkbox" id="preferNumeric"> Prefer sentences with numbers/dates (more checkable, but skips opinion ledes)</label>
    <label>Backend URL
      <input type="url" id="backendUrl" placeholder="http://localhost:3000">
    </label>
    <label>Access token (optional)
      <input type="password" id="token" autocomplete="off">
    </label>
    <button id="save">Save backend settings</button>
    <div id="saveMsg" class="sub"></div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
